<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Última actualización</title>

<style>
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f3f5f7;
        color: #202630;
    }

    .contenedor {
        max-width: 960px;
        margin: 35px auto;
        padding: 0 18px;
    }

    h1 {
        margin: 0 0 8px;
        font-size: 27px;
    }

    .subtitulo {
        margin: 0 0 22px;
        color: #657080;
    }

    .panel {
        background: #ffffff;
        border: 1px solid #d9dee5;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 14px rgba(0, 0, 0, .06);
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th, td {
        padding: 14px 16px;
        text-align: left;
        border-bottom: 1px solid #e7ebef;
    }

    th {
        background: #eaf0f6;
        font-size: 14px;
    }

    tbody tr:last-child td {
        border-bottom: 0;
    }

    .archivo {
        font-weight: 700;
    }

    .hace {
        font-weight: 700;
        white-space: nowrap;
    }

    .estado {
        display: inline-block;
        min-width: 110px;
        padding: 6px 10px;
        border-radius: 999px;
        text-align: center;
        font-weight: 700;
    }

    .estado-verde {
        background: #dcfce7;
        color: #166534;
    }

    .estado-rojo {
        background: #fee2e2;
        color: #991b1b;
    }

    .estado-gris {
        background: #e5e7eb;
        color: #374151;
    }

    .cargando {
        color: #667085;
    }

    .error {
        color: #b42318;
        font-weight: 700;
    }

    .detalle {
        margin-top: 6px;
        font-size: 12px;
        font-weight: 400;
        color: #667085;
    }

    .barra {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-top: 16px;
        flex-wrap: wrap;
    }

    #consulta {
        color: #667085;
        font-size: 13px;
    }

    button {
        border: 0;
        border-radius: 8px;
        padding: 11px 18px;
        background: #0061ff;
        color: white;
        font-weight: 700;
        cursor: pointer;
    }

    button:disabled {
        opacity: .6;
        cursor: wait;
    }

    @media (max-width: 680px) {
        .contenedor {
            margin-top: 20px;
        }

        th, td {
            padding: 11px 9px;
        }
    }
</style>
</head>

<body>

<div class="contenedor">

    <h1>Última actualización</h1>

    <p class="subtitulo">
        Estado consolidado de las fuentes de datos.
    </p>

    <div class="panel">
        <table>
            <thead>
                <tr>
                    <th>Archivo</th>
                    <th>Hace cuánto</th>
                </tr>
            </thead>
            <tbody id="tabla"></tbody>
        </table>
    </div>

    <div class="barra">
        <span id="consulta"></span>
        <button id="actualizar" type="button">Actualizar ahora</button>
    </div>

</div>

<script>

/* ==========================================================
   CONFIGURACIÓN
   ========================================================== */

const URL_ULTIMO_GUARDADO =
    "https://dl.dropbox.com/scl/fi/9ts4dhfsqh6lhi49kdvf2/UltimoGuardado.json?rlkey=j4t4r35xlorh62pzrknxbwynw&dl=1";

/*
   Conservamos los límites individuales que tenía el dashboard.
   Si aparece una fuente nueva que no esté aquí, se usa el
   limiteMinutos del propio UltimoGuardado.json.
*/
const LIMITES = {
    "DATOS ARCGIS": 90,
    "ENVÍO DE CORREOS": 10,
    "DESCARGA POLO": 15,
    "MUESTRAS ONLINE": 35,
    "PILAS ONLINE": 35,
    "CONSULTAS SISTEMA": 10,
    "PLANILLA JAUSER": 15,
    "PLANILLA": 15,
    "AGREGAR CONDUCTORES A REMITO SP": 15
};

const tabla = document.getElementById("tabla");
const boton = document.getElementById("actualizar");
const consulta = document.getElementById("consulta");


/* ==========================================================
   UTILIDADES
   ========================================================== */

function escapar(texto) {
    return String(texto ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
}


function formatearFechaConsulta(fecha) {
    return new Intl.DateTimeFormat("es-UY", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
    }).format(fecha);
}


function formatearFechaArchivo(fecha) {
    return new Intl.DateTimeFormat("es-UY", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
    }).format(fecha);
}


function convertirFechaISO(valor) {

    if (!valor) return null;

    const fecha = new Date(valor);

    if (Number.isNaN(fecha.getTime())) {
        return null;
    }

    return fecha;
}


function calcularHaceCuanto(fecha, limiteMinutos) {

    if (!(fecha instanceof Date) || Number.isNaN(fecha.getTime())) {
        return {
            texto: "Fecha no reconocida",
            clase: "estado-gris",
            minutosOrden: Number.POSITIVE_INFINITY
        };
    }

    let diferencia = Date.now() - fecha.getTime();

    const futuro = diferencia < 0;

    diferencia = Math.abs(diferencia);

    const minutosTotales = Math.floor(diferencia / 60000);

    const dias = Math.floor(minutosTotales / 1440);
    const horas = Math.floor((minutosTotales % 1440) / 60);
    const minutos = minutosTotales % 60;

    let detalle;

    if (minutosTotales < 1) {
        detalle = "1 min";
    } else if (dias > 0) {
        detalle = `${dias} d ${horas} h`;
    } else if (horas > 0) {
        detalle = `${horas} h ${minutos} min`;
    } else {
        detalle = `${minutos} min`;
    }

    let clase = "estado-verde";

    if (futuro) {
        clase = "estado-gris";
    } else if (
        limiteMinutos !== null &&
        limiteMinutos !== undefined &&
        minutosTotales > limiteMinutos
    ) {
        clase = "estado-rojo";
    }

    return {
        texto: futuro ? `en ${detalle}` : `hace ${detalle}`,
        clase,
        minutosOrden: futuro ? -minutosTotales : minutosTotales
    };
}


function mostrarCargando() {

    tabla.innerHTML = `
        <tr>
            <td class="archivo">ULTIMO GUARDADO</td>
            <td class="cargando">Consultando…</td>
        </tr>
    `;

}


/* ==========================================================
   DESCARGA ÚNICA
   ========================================================== */

async function descargarUltimoGuardado() {

    const separador = URL_ULTIMO_GUARDADO.includes("?") ? "&" : "?";

    const url =
        URL_ULTIMO_GUARDADO +
        separador +
        "_=" +
        Date.now();

    /*
       Primer intento: Dropbox directo.
       Es la ruta normal y la más rápida.
    */
    try {

        const respuesta = await fetch(url, {
            method: "GET",
            cache: "no-store",
            redirect: "follow"
        });

        if (!respuesta.ok) {
            throw new Error(`HTTP ${respuesta.status}`);
        }

        return await respuesta.json();

    } catch (errorDirecto) {

        /*
           Fallback únicamente si el navegador bloquea Dropbox
           por CORS. Sigue siendo UN SOLO archivo JSON, no los
           9 archivos originales.
        */

        const proxy =
            "https://corsproxy.io/?" +
            encodeURIComponent(url);

        const respuestaProxy = await fetch(proxy, {
            method: "GET",
            cache: "no-store"
        });

        if (!respuestaProxy.ok) {
            throw new Error(
                `No se pudo consultar UltimoGuardado.json. ` +
                `Directo: ${errorDirecto.message}. ` +
                `Proxy: HTTP ${respuestaProxy.status}`
            );
        }

        return await respuestaProxy.json();
    }
}


/* ==========================================================
   RENDER
   ========================================================== */

function renderizar(datos) {

    if (!datos || !Array.isArray(datos.archivos)) {
        throw new Error("UltimoGuardado.json no contiene el arreglo 'archivos'.");
    }

    const resultados = datos.archivos.map(item => {

        const fecha = convertirFechaISO(item.actualizado);

        const limite =
            Object.prototype.hasOwnProperty.call(LIMITES, item.nombre)
                ? LIMITES[item.nombre]
                : item.limiteMinutos;

        const estado =
            item.estadoLectura === "OK"
                ? calcularHaceCuanto(fecha, limite)
                : {
                    texto: "Error",
                    clase: "estado-gris",
                    minutosOrden: Number.POSITIVE_INFINITY
                };

        return {
            ...item,
            fecha,
            limite,
            estado
        };
    });


    /*
       Igual que el dashboard anterior:
       los datos más recientes aparecen primero.
    */
    resultados.sort(
        (a, b) =>
            a.estado.minutosOrden -
            b.estado.minutosOrden
    );


    tabla.innerHTML = resultados.map(item => {

        if (item.estadoLectura !== "OK") {

            return `
                <tr>
                    <td class="archivo">
                        ${escapar(item.nombre)}
                    </td>

                    <td class="error">
                        ${escapar(item.error || "Error de lectura")}
                    </td>
                </tr>
            `;
        }


        const fechaTexto =
            item.fecha
                ? formatearFechaArchivo(item.fecha)
                : "Fecha no reconocida";


        return `
            <tr>

                <td class="archivo">
                    ${escapar(item.nombre)}
                </td>

                <td class="hace">

                    <span class="estado ${item.estado.clase}">
                        ${escapar(item.estado.texto)}
                    </span>

                    <div class="detalle">
                        ${escapar(fechaTexto)}
                    </div>

                </td>

            </tr>
        `;

    }).join("");


    const ahora = new Date();

    let textoConsulta =
        "Última consulta: " +
        formatearFechaConsulta(ahora);


    if (datos.generado) {

        const fechaGenerado =
            convertirFechaISO(datos.generado);

        if (fechaGenerado) {

            textoConsulta +=
                " · JSON generado: " +
                formatearFechaConsulta(fechaGenerado);

        }

    }


    consulta.textContent = textoConsulta;
}


/* ==========================================================
   ACTUALIZAR
   ========================================================== */

async function actualizar() {

    boton.disabled = true;

    mostrarCargando();


    try {

        const datos =
            await descargarUltimoGuardado();

        renderizar(datos);

    } catch (error) {

        tabla.innerHTML = `
            <tr>
                <td class="archivo">
                    ULTIMO GUARDADO
                </td>
                <td class="error">
                    ${escapar(error.message)}
                </td>
            </tr>
        `;

        consulta.textContent =
            "Última consulta fallida: " +
            formatearFechaConsulta(new Date());

    } finally {

        boton.disabled = false;

    }

}


/* ==========================================================
   INICIO
   ========================================================== */

boton.addEventListener("click", actualizar);

actualizar();

/* Actualización automática cada 5 minutos */
setInterval(actualizar, 5 * 60 * 1000);

</script>

</body>
</html>
