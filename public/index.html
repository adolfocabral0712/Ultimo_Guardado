<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Control de Actualizaciones</title>


<style>

:root {

    --bg: #07111f;

    --panel: #0d1b2d;

    --panel2: #11243a;

    --border: rgba(148,163,184,.18);

    --text: #e8eef7;

    --muted: #94a3b8;

    --green: #22c55e;

    --red: #ef4444;

    --yellow: #f59e0b;

    --blue: #38bdf8;
}


* {
    box-sizing: border-box;
}


body {

    margin: 0;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at top right,
            rgba(56,189,248,.08),
            transparent 30%
        ),
        var(--bg);

    color: var(--text);

    font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;
}


.dashboard {

    width: min(1200px, 100%);

    margin: auto;

    padding: 24px;
}


.header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 20px;

    margin-bottom: 22px;
}


h1 {

    margin: 0;

    font-size: 32px;

    letter-spacing: -.5px;
}


.subtitulo {

    margin-top: 7px;

    color: var(--muted);

    font-size: 13px;
}


.estado-general {

    padding: 9px 14px;

    border: 1px solid var(--border);

    border-radius: 999px;

    background: var(--panel);

    color: var(--muted);

    font-size: 12px;
}


.grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(300px, 1fr)
        );

    gap: 14px;
}


.card {

    position: relative;

    overflow: hidden;

    padding: 18px;

    border: 1px solid var(--border);

    border-radius: 15px;

    background:
        linear-gradient(
            180deg,
            rgba(17,36,58,.98),
            rgba(13,27,45,.98)
        );
}


.card::before {

    content: "";

    position: absolute;

    left: 0;

    top: 0;

    bottom: 0;

    width: 4px;

    background: var(--yellow);
}


.card.ok::before {
    background: var(--green);
}


.card.error::before {
    background: var(--red);
}


.nombre {

    margin-bottom: 13px;

    color: var(--muted);

    font-size: 11px;

    font-weight: 800;

    letter-spacing: .6px;
}


.fecha {

    font-size: 19px;

    font-weight: 750;
}


.detalle {

    margin-top: 8px;

    min-height: 16px;

    color: var(--muted);

    font-size: 10px;
}


.footer {

    display: flex;

    justify-content: space-between;

    margin-top: 20px;

    color: var(--muted);

    font-size: 10px;
}


@media (max-width: 650px) {

    .dashboard {
        padding: 12px;
    }


    .header {

        display: block;

        margin-bottom: 15px;
    }


    h1 {

        font-size: 24px;
    }


    .estado-general {

        display: inline-block;

        margin-top: 10px;
    }


    .grid {

        grid-template-columns: 1fr;
    }


    .fecha {

        font-size: 17px;
    }


    .footer {

        display: block;
    }

}

</style>

</head>


<body>


<main class="dashboard">


<header class="header">

    <div>

        <h1>Control de Actualizaciones</h1>

        <div class="subtitulo">
            Estado de actualización de sistemas
        </div>

    </div>


    <div
        id="estadoGeneral"
        class="estado-general"
    >
        Cargando...
    </div>

</header>



<section
    id="grid"
    class="grid"
>
</section>



<div class="footer">

    <span id="ultimaConsulta">
        Última consulta: —
    </span>

    <span>
        Actualización automática cada 5 minutos
    </span>

</div>


</main>


<script>

// ============================================================
// CONFIGURACIÓN
// ============================================================

const API_URL = "/api/estado";

const INTERVALO =
    5 * 60 * 1000;


// ============================================================
// ELEMENTOS
// ============================================================

const grid =
    document.getElementById("grid");

const estadoGeneral =
    document.getElementById("estadoGeneral");

const ultimaConsulta =
    document.getElementById("ultimaConsulta");


// ============================================================
// FORMATO FECHA
// ============================================================

function formatearFecha(valor) {

    if (!valor) {
        return "Sin información";
    }


    // Intentar convertir fecha ISO.

    const fecha =
        new Date(valor);


    if (!Number.isNaN(fecha.getTime())) {

        return new Intl.DateTimeFormat(
            "es-UY",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",

                hour: "2-digit",
                minute: "2-digit",

                hour12: false
            }
        ).format(fecha);
    }


    // Si ya viene como texto:
    // "Actualizado: 17/08/2026 15:30"

    return String(valor)
        .replace(/^Actualizado:\s*/i, "")
        .trim();
}


// ============================================================
// CARGAR DATOS
// ============================================================

async function cargarDatos() {

    estadoGeneral.textContent =
        "Actualizando...";


    try {

        const respuesta =
            await fetch(
                `${API_URL}?t=${Date.now()}`,
                {
                    cache: "no-store"
                }
            );


        if (!respuesta.ok) {

            throw new Error(
                `HTTP ${respuesta.status}`
            );
        }


        const datos =
            await respuesta.json();


        if (!Array.isArray(datos.archivos)) {

            throw new Error(
                "Respuesta API incorrecta"
            );
        }


        renderizar(datos.archivos);


        const errores =
            datos.archivos.filter(
                item =>
                    item.estado !== "OK"
            ).length;


        if (errores === 0) {

            estadoGeneral.textContent =
                "Todos en línea";

        } else {

            estadoGeneral.textContent =
                `${errores} con observaciones`;
        }


        ultimaConsulta.textContent =
            "Última consulta: " +
            new Intl.DateTimeFormat(
                "es-UY",
                {
                    day: "2-digit",
                    month: "2-digit",
                    year: "numeric",

                    hour: "2-digit",
                    minute: "2-digit",

                    hour12: false
                }
            ).format(
                new Date()
            );


    } catch (error) {

        console.error(error);


        estadoGeneral.textContent =
            "Error de conexión";


        grid.innerHTML = `

            <article class="card error">

                <div class="nombre">
                    ERROR
                </div>

                <div class="fecha">
                    No fue posible cargar los datos
                </div>

                <div class="detalle">
                    ${escapeHtml(error.message)}
                </div>

            </article>

        `;
    }
}


// ============================================================
// RENDER
// ============================================================

function renderizar(archivos) {

    grid.innerHTML =
        archivos.map(item => {

            const clase =
                item.estado === "OK"
                    ? "ok"
                    : "error";


            const fecha =
                item.estado === "OK"
                    ? "Actualizado: " +
                      formatearFecha(
                          item.actualizado
                      )
                    : "Sin actualización";


            return `

                <article
                    class="card ${clase}"
                >

                    <div class="nombre">
                        ${escapeHtml(item.nombre)}
                    </div>

                    <div class="fecha">
                        ${escapeHtml(fecha)}
                    </div>

                    <div class="detalle">
                        ${
                            item.detalle
                                ? escapeHtml(
                                    item.detalle
                                  )
                                : "&nbsp;"
                        }
                    </div>

                </article>

            `;

        }).join("");
}


// ============================================================
// SEGURIDAD HTML
// ============================================================

function escapeHtml(valor) {

    return String(valor)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );
}


// ============================================================
// INICIO
// ============================================================

cargarDatos();

setInterval(
    cargarDatos,
    INTERVALO
);

</script>


</body>

</html>
