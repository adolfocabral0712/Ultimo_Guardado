<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actualización de archivos Excel</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f3f5f7;
        color: #202630;
    }

    .contenedor {
        max-width: 960px;
        margin: 35px auto;
        padding: 0 18px;
    }

    h1 {
        margin: 0 0 8px;
        font-size: 27px;
    }

    .subtitulo {
        margin: 0 0 22px;
        color: #657080;
    }

    .panel {
        background: #ffffff;
        border: 1px solid #d9dee5;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 14px rgba(0, 0, 0, .06);
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th, td {
        padding: 14px 16px;
        text-align: left;
        border-bottom: 1px solid #e7ebef;
    }

    th {
        background: #eaf0f6;
        font-size: 14px;
    }

    tbody tr:last-child td {
        border-bottom: 0;
    }

    .archivo {
        font-weight: 700;
    }

    .valor {
        font-size: 17px;
        font-weight: 700;
        white-space: nowrap;
    }

    .hace {
        font-weight: 700;
        white-space: nowrap;
    }

    .estado {
        display: inline-block;
        min-width: 110px;
        padding: 6px 10px;
        border-radius: 999px;
        text-align: center;
        font-weight: 700;
    }

    .estado-verde {
        background: #dcfce7;
        color: #166534;
    }

    .estado-amarillo {
        background: #fef3c7;
        color: #92400e;
    }

    .estado-naranja {
        background: #ffedd5;
        color: #9a3412;
    }

    .estado-rojo {
        background: #fee2e2;
        color: #991b1b;
    }

    .estado-gris {
        background: #e5e7eb;
        color: #374151;
    }

    .cargando {
        color: #667085;
    }

    .error {
        color: #b42318;
        font-weight: 700;
    }

    .barra {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-top: 16px;
    }

    #consulta {
        color: #667085;
        font-size: 13px;
    }

    button {
        border: 0;
        border-radius: 8px;
        padding: 11px 18px;
        background: #0061ff;
        color: white;
        font-weight: 700;
        cursor: pointer;
    }

    button:disabled {
        opacity: .6;
        cursor: wait;
    }

    @media (max-width: 680px) {
        .contenedor {
            margin-top: 20px;
        }

        th, td {
            padding: 11px 9px;
        }

        .valor {
            font-size: 15px;
            white-space: normal;
        }
    }
</style>
</head>

<body>
<div class="contenedor">
    <h1>Última actualización</h1>
    <p class="subtitulo">
        El dashboard descarga cada libro desde Dropbox y lee la hoja y celda configuradas.
    </p>

    <div class="panel">
        <table>
            <thead>
                <tr>
                    <th>Archivo</th>
                    <th>Hace cuánto</th>
                </tr>
            </thead>
            <tbody id="tabla"></tbody>
        </table>
    </div>

    <div class="barra">
        <span id="consulta"></span>
        <button id="actualizar" type="button">Actualizar ahora</button>
    </div>
</div>

<script>
const archivos = [
    {
        nombre: "DATOS ARCGIS",
        limiteMinutos: 90,
        tipo: "json",
        campoActualizado: "ACTUALIZADO",
        url: "https://dl.dropbox.com/scl/fi/z2y0ojao8niahmtk525jc/DatosArcGIS.json?rlkey=kh8pobprt7hw0pwe7xrhru7ma&dl=1"
    },
    {
        nombre: "ENVÍO DE CORREOS",
        limiteMinutos: 5,
        hoja: null,
        celda: "I1",
        buscarEnTodasLasHojas: true,
        url: "https://dl.dropbox.com/scl/fi/l87boeiqu54yra3i0evd6/aENVIO-DE-CORREOS.xlsb?rlkey=149gw31ntsbso8vtpix30yxjl&dl=1"
    },
    {
        nombre: "DESCARGA POLO",
        limiteMinutos: 15,
        hoja: "Hoja1",
        celda: "A1",
        buscarEnTodasLasHojas: false,
        url: "https://dl.dropbox.com/scl/fi/a6cv8r5dcc85x10ztxzd0/DESCARGA-POLO.xlsm?rlkey=1f0s6ysc4og0l8b6q7mq4a1mc&dl=1"
    },
    {
        nombre: "MUESTRAS ONLINE",
        limiteMinutos: 35,
        hoja: "Hoja3",
        celda: "B1",
        buscarEnTodasLasHojas: false,
        url: "https://dl.dropbox.com/scl/fi/vxlc0xscum4y2smwudxm7/MUESTRAS-online.xlsm?rlkey=uj0iwjahm9uapfdik3aduxbtn&dl=1"
    },
    {
        nombre: "PILAS ONLINE",
        limiteMinutos: 35,
        hoja: "Hoja2",
        celda: "A1",
        buscarEnTodasLasHojas: false,
        url: "https://dl.dropbox.com/scl/fi/9ocvyfhxi5lj1o8gxz8f0/PilasOnline.xlsm?rlkey=e4gh5o7sxno32u0nk1webl25r&dl=1"
    },
    {
        nombre: "CONSULTAS SISTEMA",
        limiteMinutos: 10,
        hoja: "Hoja2",
        celda: "A1",
        buscarEnTodasLasHojas: false,
        url: "https://dl.dropbox.com/scl/fi/9i03jw9jkxuxjic11geef/CONSULTAS-SISTEMA.xlsm?rlkey=jky2kmdl0159904ytat5j9v66&dl=1"
    },
    {
        nombre: "PLANILLA JAUSER",
        limiteMinutos: 15,
        hoja: "DATOS_PARA_IMPORTAR",
        celda: "B1",
        buscarEnTodasLasHojas: false,
        url: "https://dl.dropbox.com/scl/fi/abxg80f8tb8947ruszwz9/PLANILLA-JAUSER.xlsb?rlkey=99iedhq9pfexfev568boeg3nl&dl=1"
    },
    {
        nombre: "PLANILLA",
        limiteMinutos: 15,
        hoja: "DATOS_PARA_IMPORTAR",
        celda: "E1",
        buscarEnTodasLasHojas: false,
        url: "https://dl.dropbox.com/scl/fi/j47cweyd63abyn7fb741i/PLANILLA.xlsb?rlkey=vjhsdaa5s4jocma2g8cwl5njo&dl=0"
    },
    {
        nombre: "AGREGAR CONDUCTORES A REMITO SP",
        limiteMinutos: 15,
        hoja: "RECIBO",
        celda: "R1",
        buscarEnTodasLasHojas: false,
        url: "https://dl.dropbox.com/scl/fi/8r7iugu2bvcmstfwfwutv/AGREGAR-CONDUCTORES-A-REMITO-SP.xlsm?rlkey=f10ete2nh3hvwbnwq6p79ejbn&dl=1"
    }
];

const tabla = document.getElementById("tabla");
const boton = document.getElementById("actualizar");
const consulta = document.getElementById("consulta");

function escapar(texto) {
    return String(texto)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
}

function mostrarCargando() {
    tabla.innerHTML = archivos.map(archivo => `
        <tr>
            <td class="archivo">${escapar(archivo.nombre)}</td>
            <td class="cargando">Descargando y leyendo…</td>
        </tr>
    `).join("");
}

function fechaConsulta() {
    return new Intl.DateTimeFormat("es-UY", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
    }).format(new Date());
}


function limpiarTextoActualizacion(texto) {
    return String(texto || "")
        .replace(/^\s*Act\.\s*:?\s*/i, "")
        .replace(/^\s*Actualizado\s*:\s*/i, "")
        .trim();
}

function convertirAFecha(celda, valorMostrado) {
    if (!celda) return null;

    if (celda.v instanceof Date && !Number.isNaN(celda.v.getTime())) {
        return celda.v;
    }

    if (typeof celda.v === "number" && typeof XLSX !== "undefined") {
        const partes = XLSX.SSF.parse_date_code(celda.v);
        if (partes) {
            return new Date(
                partes.y,
                partes.m - 1,
                partes.d,
                partes.H || 0,
                partes.M || 0,
                Math.floor(partes.S || 0)
            );
        }
    }

    const texto = limpiarTextoActualizacion(valorMostrado || celda.v || "");

    // Formato habitual: dd/mm/yyyy hh:mm o dd/mm/yyyy hh:mm:ss
    let m = texto.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
    if (m) {
        let anio = Number(m[3]);
        if (anio < 100) anio += 2000;

        const fecha = new Date(
            anio,
            Number(m[2]) - 1,
            Number(m[1]),
            Number(m[4] || 0),
            Number(m[5] || 0),
            Number(m[6] || 0)
        );

        if (!Number.isNaN(fecha.getTime())) return fecha;
    }

    const fechaGenerica = new Date(texto);
    return Number.isNaN(fechaGenerica.getTime()) ? null : fechaGenerica;
}

function calcularHaceCuanto(fecha, limiteMinutos) {
    if (!(fecha instanceof Date) || Number.isNaN(fecha.getTime())) {
        return {
            texto: "Fecha no reconocida",
            clase: "estado-gris"
        };
    }

    let diferencia = Date.now() - fecha.getTime();
    const futuro = diferencia < 0;
    diferencia = Math.abs(diferencia);

    const minutosTotales = Math.floor(diferencia / 60000);
    const dias = Math.floor(minutosTotales / 1440);
    const horas = Math.floor((minutosTotales % 1440) / 60);
    const minutos = minutosTotales % 60;

    let detalle;

    if (minutosTotales < 1) {
        detalle = "1 min";
    } else if (dias > 0) {
        detalle = `${dias} d ${horas} h`;
    } else if (horas > 0) {
        detalle = `${horas} h ${minutos} min`;
    } else {
        detalle = `${minutos} min`;
    }

    let clase = "estado-verde";

    if (futuro || limiteMinutos === null || limiteMinutos === undefined) {
        clase = "estado-gris";
    } else if (minutosTotales > limiteMinutos) {
        clase = "estado-rojo";
    }

    return {
        texto: futuro ? `en ${detalle}` : `hace ${detalle}`,
        clase,
        minutosOrden: futuro ? -minutosTotales : minutosTotales
    };
}
function valorCeldaFormateado(celda) {
    if (!celda) return "";

    let valor = "";

    if (celda.w !== undefined && celda.w !== null && String(celda.w).trim() !== "") {
        valor = String(celda.w).trim();
    } else if (celda.v instanceof Date) {
        valor = new Intl.DateTimeFormat("es-UY", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false
        }).format(celda.v);
    } else {
        valor = celda.v === undefined || celda.v === null
            ? ""
            : String(celda.v).trim();
    }

    return limpiarTextoActualizacion(valor);
}

function leerCeldaExacta(libro, archivo) {
    if (archivo.buscarEnTodasLasHojas) {
        for (const nombreHoja of libro.SheetNames) {
            const hoja = libro.Sheets[nombreHoja];
            const celda = hoja[archivo.celda];
            const valor = valorCeldaFormateado(celda);

            if (valor !== "") {
                return {
                    valor,
                    hoja: nombreHoja,
                    fecha: convertirAFecha(celda, valor)
                };
            }
        }

        throw new Error(`La celda ${archivo.celda} está vacía en todas las hojas`);
    }

    const hoja = libro.Sheets[archivo.hoja];

    if (!hoja) {
        throw new Error(`No existe la hoja ${archivo.hoja}`);
    }

    const celda = hoja[archivo.celda];
    const valor = valorCeldaFormateado(celda);

    if (valor === "") {
        throw new Error(`La celda ${archivo.hoja}!${archivo.celda} está vacía`);
    }

    return {
        valor,
        hoja: archivo.hoja,
        fecha: convertirAFecha(celda, valor)
    };
}

function crearVariantesDropbox(urlOriginal) {
    const url = new URL(urlOriginal);

    // Quitar controles anteriores para construir enlaces limpios.
    url.searchParams.delete("dl");
    url.searchParams.delete("raw");
    url.searchParams.delete("_");

    const ruta = url.pathname;
    const consulta = url.searchParams.toString();
    const sufijo = consulta ? `?${consulta}` : "";

    return [
        `https://dl.dropbox.com${ruta}${sufijo}&dl=1`,
        `https://www.dropbox.com${ruta}${sufijo}&raw=1`,
        `https://www.dropbox.com${ruta}${sufijo}&dl=1`,
        `https://dl.dropboxusercontent.com${ruta}${sufijo}&dl=1`
    ];
}

async function descargarDirecto(url) {
    const separador = url.includes("?") ? "&" : "?";

    const respuesta = await fetch(url + separador + "_=" + Date.now(), {
        method: "GET",
        cache: "no-store",
        redirect: "follow"
    });

    if (!respuesta.ok) {
        throw new Error(`Directo HTTP ${respuesta.status}`);
    }

    return respuesta.arrayBuffer();
}

async function descargarConProxy(url) {
    const proxies = [
        "https://corsproxy.io/?" + encodeURIComponent(url),
        "https://api.allorigins.win/raw?url=" + encodeURIComponent(url)
    ];

    const errores = [];

    for (const proxy of proxies) {
        try {
            const respuesta = await fetch(proxy, {
                method: "GET",
                cache: "no-store"
            });

            if (!respuesta.ok) {
                throw new Error(`HTTP ${respuesta.status}`);
            }

            return await respuesta.arrayBuffer();
        } catch (error) {
            errores.push(error.message);
        }
    }

    throw new Error("Proxy: " + errores.join(" | "));
}

async function descargarArchivo(urlOriginal) {
    const variantes = crearVariantesDropbox(urlOriginal);
    const errores = [];

    for (const url of variantes) {
        try {
            return await descargarDirecto(url);
        } catch (errorDirecto) {
            errores.push(errorDirecto.message);

            try {
                return await descargarConProxy(url);
            } catch (errorProxy) {
                errores.push(errorProxy.message);
            }
        }
    }

    throw new Error(
        "No se pudo descargar el archivo. " +
        "Puede ser un bloqueo CORS, un límite de tamaño del proxy o un enlace sin acceso público. " +
        errores.slice(-4).join(" · ")
    );
}

function extraerActualizadoJSON(contenido, archivo) {
    const campo = archivo.campoActualizado || "ACTUALIZADO";

    let valor = "";

    if (Array.isArray(contenido)) {
        const primerRegistro = contenido.find(
            item => item && typeof item === "object" && item[campo]
        );

        if (primerRegistro) {
            valor = primerRegistro[campo];
        }
    } else if (contenido && typeof contenido === "object") {
        valor =
            contenido[campo] ||
            contenido.actualizado ||
            contenido.Actualizado ||
            "";
    }

    valor = String(valor || "").trim();

    if (!valor) {
        throw new Error(`No se encontró el campo ${campo} en el JSON`);
    }

    const textoLimpio = limpiarTextoActualizacion(valor);
    const fecha = convertirAFecha(
        { v: textoLimpio },
        textoLimpio
    );

    return {
        valor: textoLimpio,
        hoja: "JSON",
        fecha
    };
}

async function leerActualizacionJSON(archivo) {
    const datos = await descargarArchivo(archivo.url);
    const texto = new TextDecoder("utf-8").decode(datos);
    const contenido = JSON.parse(texto);

    return extraerActualizadoJSON(contenido, archivo);
}

async function leerActualizacion(archivo) {
    if (archivo.tipo === "json") {
        return leerActualizacionJSON(archivo);
    }

    const datos = await descargarArchivo(archivo.url);

    const libro = XLSX.read(datos, {
        type: "array",
        cellDates: true,
        cellNF: true,
        cellText: true
    });

    return leerCeldaExacta(libro, archivo);
}

async function actualizar() {
    boton.disabled = true;
    mostrarCargando();

    const resultados = await Promise.all(
        archivos.map(async archivo => {
            try {
                const resultado = await leerActualizacion(archivo);

                return {
                    archivo,
                    resultado,
                    error: null
                };
            } catch (error) {
                return {
                    archivo,
                    resultado: null,
                    error: error.message
                };
            }
        })
    );

    const resultadosOrdenados = resultados
        .map(item => {
            if (item.error) {
                return {
                    ...item,
                    estado: null,
                    orden: Number.POSITIVE_INFINITY
                };
            }

            const estado = calcularHaceCuanto(
                item.resultado.fecha,
                item.archivo.limiteMinutos
            );

            return {
                ...item,
                estado,
                orden: estado.minutosOrden
            };
        })
        .sort((a, b) => a.orden - b.orden);

    tabla.innerHTML = resultadosOrdenados.map(item => {
        if (item.error) {
            return `
                <tr>
                    <td class="archivo">${escapar(item.archivo.nombre)}</td>
                    <td class="error">${escapar(item.error)}</td>
                </tr>
            `;
        }

        return `
            <tr>
                <td class="archivo">${escapar(item.archivo.nombre)}</td>
                <td class="hace">
                    <span class="estado ${item.estado.clase}">
                        ${escapar(item.estado.texto)}
                    </span>
                    <div style="margin-top:6px;font-size:12px;font-weight:400;color:#667085;">
                        ${escapar(item.resultado.valor)}
                    </div>
                </td>
            </tr>
        `;
    }).join("");

    consulta.textContent = "Última consulta: " + fechaConsulta();
    boton.disabled = false;
}

boton.addEventListener("click", actualizar);

actualizar();
setInterval(actualizar, 5 * 60 * 1000);
</script>
